spring.application.name=Cleanersapp

# Aiven Database - values come from environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://cleaningapp-my-cleaningapp-1.a.aivencloud.com:10070/defaultdb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=${PORT:8080}